<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Real or AI? – 10 Challenge Quiz</title>

<!-- Friendly font for primary school -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#f3f4f6;
    --card:#ffffff;
    --ink:#111827;
    --muted:#6b7280;
    --line:#e5e7eb;
    --shadow: 0 10px 30px rgba(0,0,0,.10);
    --radius:16px;
  }

  body{
    font-family:"Nunito", system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    margin:0;
    background:var(--bg);
    color:var(--ink);
  }

  header{
    background:#111827;
    color:#fff;
    padding:16px;
  }
  header h2{ margin:0 0 6px 0; font-weight:900; letter-spacing:.2px; }
  header div{ opacity:.92; }

  main{ max-width:900px; margin:auto; padding:16px; }
  .card{
    background:var(--card);
    padding:16px;
    border-radius:var(--radius);
    box-shadow:var(--shadow);
  }

  .topRow{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:14px;
    flex-wrap:wrap;
  }

  .timer{
    background:#111827;
    color:#fff;
    padding:10px 12px;
    border-radius:14px;
    display:flex;
    align-items:center;
    gap:10px;
    font-weight:900;
  }
  .barOuter{
    background:rgba(255,255,255,.2);
    height:10px;
    width:240px;
    border-radius:999px;
    overflow:hidden;
  }
  .barInner{
    background:#fff;
    height:10px;
    width:100%;
    transition: width .12s linear;
  }

  .media{
    background:#0b1220;
    border-radius:var(--radius);
    min-height:320px;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    margin-top:12px;
  }
  img, video { max-width:100%; display:block; }

  .buttonRow{
    display:flex;
    gap:10px;
    margin-top:12px;
    flex-wrap:wrap;
    align-items:center;
  }

  button{
    padding:12px 16px;
    border-radius:14px;
    border:0;
    cursor:pointer;
    font-weight:900;
    font-size:16px;
  }
  button:disabled{ opacity:.5; cursor:not-allowed; }

  .real{ background:#10b981; color:#fff; }
  .ai{ background:#6366f1; color:#fff; }
  .next{ background:#111827; color:#fff; }
  .ghost{ background:#e5e7eb; color:#111827; }

  input{
    padding:12px 14px;
    border-radius:14px;
    border:2px solid var(--line);
    width:100%;
    font-size:16px;
    outline:none;
    font-family:inherit;
  }
  input:focus{ border-color:#93c5fd; box-shadow:0 0 0 4px rgba(59,130,246,.15); }

  hr{ border:0; border-top:1px solid var(--line); margin:18px 0; }

  h3{ margin:10px 0; font-weight:900; }
  .muted{ color:var(--muted); font-size:14px; }

  /* Big final score screen */
  .final {
    margin-top:14px;
    padding:14px;
    border-radius:16px;
    border:2px solid var(--line);
    background:#f9fafb;
    display:none;
  }
  .finalTop{
    display:flex;
    gap:12px;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
  }
  .scoreBig{
    font-size:44px;
    font-weight:900;
    line-height:1;
  }
  .stars{
    font-size:26px;
    letter-spacing:2px;
    font-weight:900;
  }
  .badge{
    display:inline-block;
    padding:6px 10px;
    border-radius:999px;
    background:#111827;
    color:#fff;
    font-weight:900;
    font-size:14px;
  }
</style>
</head>

<body>
<header>
  <h2>Real or AI? – 10 Challenge Quiz 🤖</h2>
  <div>60 seconds per question. Correct = seconds remaining. Wrong = 0.</div>
  <div class="muted" style="color:#cbd5e1;">No leaderboard — just play, learn, and try to beat your best!</div>
</header>

<main>
<div class="card">

  <div class="topRow">
    <div>
      <div class="muted">Round: <span id="round">—</span></div>
      <div class="muted">Team: <span id="teamLabel">—</span> · Score: <span id="scoreLabel">0</span></div>
    </div>

    <div class="timer">
      <span><span id="time">60</span>s</span>
      <div class="barOuter"><div class="barInner" id="bar"></div></div>
    </div>
  </div>

  <div class="media" id="media"></div>

  <div class="buttonRow">
    <button class="real" id="realBtn" disabled>REAL 👍</button>
    <button class="ai" id="aiBtn" disabled>AI 🤖</button>
    <button class="next" id="nextBtn" disabled>Next ▶</button>
  </div>

  <div id="result" class="muted" style="margin-top:10px;"></div>

  <div class="final" id="finalBox">
    <div class="finalTop">
      <div>
        <div class="muted">Final score</div>
        <div class="scoreBig" id="finalScore">0</div>
        <div class="stars" id="finalStars">☆☆☆☆☆</div>
      </div>
      <div>
        <div class="badge" id="finalMessage">Nice try!</div>
        <div class="muted" style="margin-top:8px;">Best on this tablet: <b id="bestScore">0</b></div>
      </div>
    </div>

    <div class="buttonRow" style="margin-top:12px;">
      <button class="next" id="playAgainBtn">Play again ▶</button>
      <button class="ghost" id="clearBestBtn" title="Clears best score on this device only">Clear best (this device)</button>
    </div>
  </div>

  <hr>

  <h3>Team Setup</h3>
  <div class="muted">Team name (no real names)</div>
  <div style="margin-top:8px;">
    <input id="teamInput" placeholder="e.g. Team Tigers" maxlength="18">
  </div>
  <div class="buttonRow" style="margin-top:10px;">
    <button id="startBtn">Start</button>
  </div>

</div>
</main>

<script>
  // QUESTIONS (UNCHANGED from your latest) :contentReference[oaicite:1]{index=1}
  const QUESTIONS = [
    {type:"image",src:"media/q1.jpg",answer:"AI"},
    {type:"image",src:"media/q2.jpg",answer:"REAL"},
    {type:"video",src:"media/q3.mp4",answer:"AI"},
    {type:"image",src:"media/q4.jpg",answer:"REAL"},
    {type:"video",src:"media/q5.mp4",answer:"AI"},
    {type:"video",src:"media/q6.mp4",answer:"REAL"},
    {type:"video",src:"media/q7.mp4",answer:"REAL"},
    {type:"video",src:"media/q8.mp4",answer:"AI"},
    {type:"video",src:"media/q9.mp4",answer:"REAL"},
    {type:"video",src:"media/q10.mp4",answer:"REAL"}
  ];

  // Elements
  const media = document.getElementById("media");
  const round = document.getElementById("round");
  const timeText = document.getElementById("time");
  const bar = document.getElementById("bar");
  const result = document.getElementById("result");

  const realBtn = document.getElementById("realBtn");
  const aiBtn = document.getElementById("aiBtn");
  const nextBtn = document.getElementById("nextBtn");

  const startBtn = document.getElementById("startBtn");
  const teamInput = document.getElementById("teamInput");
  const teamLabel = document.getElementById("teamLabel");
  const scoreLabel = document.getElementById("scoreLabel");

  const finalBox = document.getElementById("finalBox");
  const finalScore = document.getElementById("finalScore");
  const finalStars = document.getElementById("finalStars");
  const finalMessage = document.getElementById("finalMessage");
  const bestScoreEl = document.getElementById("bestScore");
  const playAgainBtn = document.getElementById("playAgainBtn");
  const clearBestBtn = document.getElementById("clearBestBtn");

  // State
  const DURATION = 60;
  let index = 0;
  let score = 0;
  let team = "";
  let time = DURATION;
  let timer = null;
  let locked = true;

  // Best score is per-device (so each tablet can have its own “personal best”)
  const BEST_KEY = "ai_quiz_best_score_v1";

  function getBest(){
    const v = Number(localStorage.getItem(BEST_KEY) || "0");
    return Number.isFinite(v) ? v : 0;
  }
  function setBest(v){
    localStorage.setItem(BEST_KEY, String(v));
  }

  function setButtonsEnabled(enabled){
    realBtn.disabled = !enabled;
    aiBtn.disabled = !enabled;
    nextBtn.disabled = true;
  }

  function startTimer(){
    clearInterval(timer);
    time = DURATION;
    timeText.textContent = time;
    bar.style.width = "100%";

    timer = setInterval(()=>{
      time--;
      timeText.textContent = time;
      bar.style.width = (time / DURATION * 100) + "%";
      if(time <= 0){
        clearInterval(timer);
        reveal(null, true);
      }
    }, 1000);
  }

  function render(){
    result.textContent = "";
    nextBtn.disabled = true;
    finalBox.style.display = "none";
    round.textContent = (index + 1) + " / " + QUESTIONS.length;

    media.innerHTML = "";
    const q = QUESTIONS[index];

    if(q.type === "image"){
      const img = document.createElement("img");
      img.src = q.src;
      img.alt = "Quiz image";
      media.appendChild(img);
    } else {
      const vid = document.createElement("video");
      vid.src = q.src;
      vid.controls = true;
      vid.playsInline = true;
      media.appendChild(vid);
    }

    locked = false;
    startTimer();
  }

  function reveal(choice, timeUp=false){
    if(locked) return;
    locked = true;

    clearInterval(timer);
    const q = QUESTIONS[index];

    let points = 0;
    if(choice && choice === q.answer){
      points = time;          // seconds remaining
      score += points;
      result.textContent = `Correct! +${points} ✅`;
    } else {
      result.textContent = timeUp ? "Time’s up! ⌛" : "Wrong! ❌";
    }

    scoreLabel.textContent = String(score);
    nextBtn.disabled = false;
  }

  function starsForScore(s){
    // 10 questions * max 60 = 600
    if(s >= 480) return {stars:"★★★★★", msg:"Amazing! 🏆"};
    if(s >= 360) return {stars:"★★★★☆", msg:"Brilliant! 🌟"};
    if(s >= 240) return {stars:"★★★☆☆", msg:"Great job! 😄"};
    if(s >= 120) return {stars:"★★☆☆☆", msg:"Good try! 👍"};
    return {stars:"★☆☆☆☆", msg:"Keep practicing! 💪"};
  }

  function showFinal(){
    finalScore.textContent = String(score);

    const {stars, msg} = starsForScore(score);
    finalStars.textContent = stars;
    finalMessage.textContent = msg;

    const prevBest = getBest();
    const newBest = Math.max(prevBest, score);
    if(newBest !== prevBest) setBest(newBest);

    bestScoreEl.textContent = String(getBest());
    finalBox.style.display = "block";
  }

  // Button wiring
  realBtn.onclick = () => reveal("REAL");
  aiBtn.onclick = () => reveal("AI");

  nextBtn.onclick = () => {
    if(index < QUESTIONS.length - 1){
      index++;
      render();
    } else {
      clearInterval(timer);
      result.textContent = "Finished! 🏁";
      setButtonsEnabled(false);
      showFinal();
    }
  };

  startBtn.onclick = () => {
    team = teamInput.value.trim();
    if(!team){ alert("Enter team name"); return; }

    teamLabel.textContent = team;
    index = 0;
    score = 0;
    scoreLabel.textContent = "0";

    setButtonsEnabled(true);
    render();
  };

  playAgainBtn.onclick = () => {
    // keep same team name for quick repeat
    if(!team){
      alert("Type a team name and press Start.");
      return;
    }
    index = 0;
    score = 0;
    scoreLabel.textContent = "0";
    setButtonsEnabled(true);
    render();
  };

  clearBestBtn.onclick = () => {
    if(confirm("Clear best score on THIS device only?")){
      setBest(0);
      bestScoreEl.textContent = "0";
    }
  };

  // Initial UI
  setButtonsEnabled(false);
  bestScoreEl.textContent = String(getBest());
</script>
</body>
</html>
