<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Real or AI? – 10 Challenge Quiz</title>

<style>
body{font-family:system-ui,Arial;margin:0;background:#f3f4f6}
header{background:#111827;color:#fff;padding:16px}
main{max-width:1100px;margin:auto;padding:16px}
.card{background:#fff;padding:16px;border-radius:14px;box-shadow:0 8px 20px rgba(0,0,0,.08)}
.media{background:#0b1220;border-radius:14px;min-height:320px;display:flex;align-items:center;justify-content:center}
img,video{max-width:100%;display:block}
button{padding:10px 14px;border-radius:10px;border:0;cursor:pointer}
.real{background:#10b981;color:#fff}
.ai{background:#6366f1;color:#fff}
.next{background:#111827;color:#fff}
button:disabled{opacity:.5}
input{padding:8px;border-radius:8px;border:1px solid #ccc;width:100%}
.table{width:100%;border-collapse:collapse;margin-top:10px}
.table td,.table th{border-bottom:1px solid #ddd;padding:6px;font-size:14px}
.timer{background:#111827;color:#fff;padding:6px 10px;border-radius:8px}
.barOuter{background:#333;height:8px;width:200px;border-radius:999px;overflow:hidden}
.barInner{background:#fff;height:8px;width:100%}
</style>
</head>

<body>

<header>
<h2>Real or AI? – 10 Challenge Quiz 🤖</h2>
<div>60 seconds per question. Correct = seconds remaining.</div>
<div id="status">Connecting...</div>
</header>

<main>
<div class="card">

<div>
Round: <span id="round"></span>
<div class="timer">
<span id="time">60</span>s
<div class="barOuter"><div class="barInner" id="bar"></div></div>
</div>
</div>

<div class="media" id="media"></div>

<div>
<button class="real" id="realBtn" disabled>REAL</button>
<button class="ai" id="aiBtn" disabled>AI</button>
<button class="next" id="nextBtn" disabled>Next</button>
</div>

<div id="result"></div>

<hr>

<h3>Team Setup</h3>
<input id="teamInput" placeholder="Team name (no real names)">
<button id="startBtn">Start</button>
<button id="saveBtn" disabled>Save Score</button>

<hr>

<h3>Top 10 Leaderboard</h3>
<button id="refreshBtn">Refresh</button>
<button id="resetBtn">Reset (Teacher)</button>

<table class="table">
<thead>
<tr><th>#</th><th>Name</th><th>Score</th><th>When</th></tr>
</thead>
<tbody id="leaderboard">
<tr><td colspan="4">Loading...</td></tr>
</tbody>
</table>

</div>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
import { getDatabase, ref, push, get, child, set } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";

/* ====== REPLACE API KEY ====== */
const firebaseConfig = {
  apiKey: "AIzaSyCAi934vzlaCr3SDq8b-3LgkCF__-v8CVo",
  authDomain: "ctk-ai-challenge.firebaseapp.com",
  databaseURL: "https://ctk-ai-challenge-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "ctk-ai-challenge",
  storageBucket: "ctk-ai-challenge.firebasestorage.app",
  messagingSenderId: "1022120470291",
  appId: "1:1022120470291:web:6e24ccc08a09e7c7e65ce6"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

const status = document.getElementById("status");

try{
  await signInAnonymously(auth);
  status.textContent = "Connected ✅";
}catch(e){
  status.textContent = "Offline ❌";
  alert("Firebase auth failed: " + e.message);
}

/* ===== QUESTIONS ===== */
const QUESTIONS = [
  {type:"image",src:"media/q1.jpg",answer:"AI"},
  {type:"image",src:"media/q2.jpg",answer:"REAL"},
  {type:"image",src:"media/q3.jpg",answer:"AI"},
  {type:"image",src:"media/q4.jpg",answer:"REAL"},
  {type:"image",src:"media/q5.jpg",answer:"AI"},
  {type:"video",src:"media/q6.mp4",answer:"AI"},
  {type:"image",src:"media/q7.jpg",answer:"REAL"},
  {type:"image",src:"media/q8.jpg",answer:"AI"},
  {type:"video",src:"media/q9.mp4",answer:"REAL"},
  {type:"image",src:"media/q10.jpg",answer:"AI"}
];

let index=0;
let score=0;
let team="";
let time=60;
let timer=null;

const media=document.getElementById("media");
const round=document.getElementById("round");
const timeText=document.getElementById("time");
const bar=document.getElementById("bar");
const result=document.getElementById("result");
const realBtn=document.getElementById("realBtn");
const aiBtn=document.getElementById("aiBtn");
const nextBtn=document.getElementById("nextBtn");
const startBtn=document.getElementById("startBtn");
const saveBtn=document.getElementById("saveBtn");
const leaderboard=document.getElementById("leaderboard");

/* ===== TIMER ===== */
function startTimer(){
  clearInterval(timer);
  time=60;
  timer=setInterval(()=>{
    time--;
    timeText.textContent=time;
    bar.style.width=(time/60*100)+"%";
    if(time<=0){
      clearInterval(timer);
      reveal(null);
    }
  },1000);
}

/* ===== RENDER QUESTION ===== */
function render(){
  result.textContent="";
  nextBtn.disabled=true;
  round.textContent=(index+1)+" / 10";
  media.innerHTML="";
  const q=QUESTIONS[index];
  if(q.type==="image"){
    const img=document.createElement("img");
    img.src=q.src;
    media.appendChild(img);
  }else{
    const vid=document.createElement("video");
    vid.src=q.src;
    vid.controls=true;
    media.appendChild(vid);
  }
  startTimer();
}

/* ===== REVEAL ===== */
function reveal(choice){
  clearInterval(timer);
  const q=QUESTIONS[index];
  let points=0;
  if(choice && choice===q.answer){
    points=time;
    score+=points;
    result.textContent="Correct! +" + points;
  }else{
    result.textContent="Wrong!";
  }
  nextBtn.disabled=false;
}

/* ===== BUTTONS ===== */
realBtn.onclick=()=>reveal("REAL");
aiBtn.onclick=()=>reveal("AI");

nextBtn.onclick=()=>{
  if(index<9){
    index++;
    render();
  }else{
    result.textContent="Finished! Score: "+score;
    saveBtn.disabled=false;
  }
};

startBtn.onclick=()=>{
  team=document.getElementById("teamInput").value.trim();
  if(!team){alert("Enter team name");return;}
  index=0;
  score=0;
  saveBtn.disabled=true;
  realBtn.disabled=false;
  aiBtn.disabled=false;
  render();
};

/* ===== SAVE ===== */
saveBtn.onclick=async()=>{
  try{
    await push(ref(db,"scores"),{
      name:team,
      score:score,
      ts:Date.now()
    });
    alert("Saved ✅");
    loadLeaderboard();
  }catch(e){
    alert("Save failed: "+e.message);
  }
};

/* ===== LEADERBOARD ===== */
async function loadLeaderboard(){
  try{
    const snap=await get(child(ref(db),"scores"));
    let rows=[];
    if(snap.exists()){
      snap.forEach(s=>rows.push(s.val()));
    }
    rows.sort((a,b)=>b.score-a.score);
    rows=rows.slice(0,10);

    if(rows.length===0){
      leaderboard.innerHTML="<tr><td colspan='4'>No scores yet</td></tr>";
      return;
    }

    leaderboard.innerHTML=rows.map((r,i)=>`
      <tr>
        <td>${i+1}</td>
        <td>${r.name}</td>
        <td>${r.score}</td>
        <td>${new Date(r.ts).toLocaleTimeString()}</td>
      </tr>
    `).join("");
  }catch(e){
    leaderboard.innerHTML="<tr><td colspan='4'>Error loading</td></tr>";
  }
}

document.getElementById("refreshBtn").onclick=loadLeaderboard;

document.getElementById("resetBtn").onclick=async()=>{
  const pin=prompt("Teacher PIN:");
  if(pin!=="1234"){alert("Wrong PIN");return;}
  await set(ref(db,"scores"),null);
  loadLeaderboard();
};

loadLeaderboard();
setInterval(loadLeaderboard,3000);
</script>

</body>
</html>
