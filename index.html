<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Real or AI? – 10 Challenge Quiz</title>

<!-- Friendly font for primary school -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#f3f4f6;
    --card:#ffffff;
    --ink:#111827;
    --muted:#6b7280;
    --line:#e5e7eb;
    --shadow: 0 10px 30px rgba(0,0,0,.10);
    --radius:16px;
  }

  body{
    font-family:"Nunito", system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    margin:0;
    background:var(--bg);
    color:var(--ink);
  }

  header{
    background:#111827;
    color:#fff;
    padding:16px;
  }
  header h2{ margin:0 0 6px 0; font-weight:900; letter-spacing:.2px; }
  header div{ opacity:.92; }

  main{ max-width:1100px; margin:auto; padding:16px; }
  .card{
    background:var(--card);
    padding:16px;
    border-radius:var(--radius);
    box-shadow:var(--shadow);
  }

  .topRow{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:14px;
    flex-wrap:wrap;
  }

  .timer{
    background:#111827;
    color:#fff;
    padding:10px 12px;
    border-radius:14px;
    display:flex;
    align-items:center;
    gap:10px;
    font-weight:900;
  }
  .barOuter{
    background:rgba(255,255,255,.2);
    height:10px;
    width:240px;
    border-radius:999px;
    overflow:hidden;
  }
  .barInner{
    background:#fff;
    height:10px;
    width:100%;
  }

  .media{
    background:#0b1220;
    border-radius:var(--radius);
    min-height:320px;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    margin-top:12px;
  }
  img, video { max-width:100%; display:block; }

  .buttonRow{
    display:flex;
    gap:10px;
    margin-top:12px;
    flex-wrap:wrap;
    align-items:center;
  }

  button{
    padding:12px 16px;
    border-radius:14px;
    border:0;
    cursor:pointer;
    font-weight:900;
    font-size:16px;
  }
  button:disabled{ opacity:.5; cursor:not-allowed; }

  .real{ background:#10b981; color:#fff; }
  .ai{ background:#6366f1; color:#fff; }
  .next{ background:#111827; color:#fff; }

  input{
    padding:12px 14px;
    border-radius:14px;
    border:2px solid var(--line);
    width:100%;
    font-size:16px;
    outline:none;
    font-family:inherit;
  }
  input:focus{ border-color:#93c5fd; box-shadow:0 0 0 4px rgba(59,130,246,.15); }

  hr{ border:0; border-top:1px solid var(--line); margin:18px 0; }

  h3{ margin:10px 0; font-weight:900; }

  .muted{ color:var(--muted); font-size:14px; }

  /* Table alignment fix */
  .table{
    width:100%;
    border-collapse:collapse;
    margin-top:10px;
    border-radius:14px;
    overflow:hidden;
  }
  .table th, .table td{
    border-bottom:1px solid var(--line);
    padding:10px 10px;
    font-size:15px;
    vertical-align:middle;
    white-space:nowrap;
  }
  .table thead th{
    background:#f3f4f6;
    font-weight:900;
  }
  .table th:nth-child(1), .table td:nth-child(1){ text-align:center; width:42px; }
  .table th:nth-child(2), .table td:nth-child(2){ text-align:left;  width:auto; }
  .table th:nth-child(3), .table td:nth-child(3){ text-align:right; width:90px; }
  .table th:nth-child(4), .table td:nth-child(4){ text-align:right; width:110px; }

  .pill{
    display:inline-block;
    padding:6px 10px;
    border-radius:999px;
    background:#e5e7eb;
    color:#111827;
    font-weight:900;
    margin-top:6px;
  }
</style>
</head>

<body>
<header>
  <h2>Real or AI? – 10 Challenge Quiz 🤖</h2>
  <div>60 seconds per question. Correct = seconds remaining.</div>
  <div id="status" class="pill">Connecting...</div>
</header>

<main>
<div class="card">

  <div class="topRow">
    <div>
      <div class="muted">Round: <span id="round">—</span></div>
    </div>

    <div class="timer">
      <span><span id="time">60</span>s</span>
      <div class="barOuter"><div class="barInner" id="bar"></div></div>
    </div>
  </div>

  <div class="media" id="media"></div>

  <div class="buttonRow">
    <button class="real" id="realBtn" disabled>REAL 👍</button>
    <button class="ai" id="aiBtn" disabled>AI 🤖</button>
    <button class="next" id="nextBtn" disabled>Next ▶</button>
  </div>

  <div id="result" class="muted" style="margin-top:10px;"></div>

  <hr>

  <h3>Team Setup</h3>
  <div class="muted">Team name (no real names)</div>
  <div style="margin-top:8px;">
    <input id="teamInput" placeholder="e.g. Team Tigers" maxlength="18">
  </div>
  <div class="buttonRow" style="margin-top:10px;">
    <button id="startBtn">Start</button>
    <button id="saveBtn" disabled>Save Score</button>
  </div>

  <hr>

  <h3>Top 10 Leaderboard</h3>
  <div class="buttonRow" style="margin-top:8px;">
    <button id="refreshBtn">Refresh</button>
    <button id="resetBtn">Reset (Teacher)</button>
  </div>

  <table class="table">
    <thead>
      <tr><th>#</th><th>Name</th><th>Score</th><th>When</th></tr>
    </thead>
    <tbody id="leaderboard">
      <tr><td colspan="4" class="muted">Loading…</td></tr>
    </tbody>
  </table>

</div>
</main>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
  import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
  import { getDatabase, ref, push, set, onValue, query, orderByChild, limitToLast, get } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";

  // ✅ Paste your current API key here
  const firebaseConfig = {
    apiKey: "AIzaSyCAi934vzlaCr3SDq8b-3LgkCF__-v8CVo",
    authDomain: "ctk-ai-challenge.firebaseapp.com",
    databaseURL: "https://ctk-ai-challenge-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "ctk-ai-challenge",
    storageBucket: "ctk-ai-challenge.firebasestorage.app",
    messagingSenderId: "1022120470291",
    appId: "1:1022120470291:web:6e24ccc08a09e7c7e65ce6"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getDatabase(app);

  const status = document.getElementById("status");

  try {
    await signInAnonymously(auth);
    status.textContent = "Connected ✅";
    status.style.background = "#dcfce7";
    status.style.color = "#166534";
  } catch (e) {
    status.textContent = "Offline ❌";
    status.style.background = "#fee2e2";
    status.style.color = "#991b1b";
    alert("Firebase auth failed: " + (e?.code || e?.message || "unknown error"));
  }

  // ✅ QUESTIONS (UNCHANGED from your latest)
  const QUESTIONS = [
    {type:"image",src:"media/q1.jpg",answer:"AI"},
    {type:"image",src:"media/q2.jpg",answer:"REAL"},
    {type:"video",src:"media/q3.mp4",answer:"AI"},
    {type:"image",src:"media/q4.jpg",answer:"REAL"},
    {type:"video",src:"media/q5.mp4",answer:"AI"},
    {type:"video",src:"media/q6.mp4",answer:"REAL"},
    {type:"video",src:"media/q7.mp4",answer:"REAL"},
    {type:"video",src:"media/q8.mp4",answer:"AI"},
    {type:"video",src:"media/q9.mp4",answer:"REAL"},
    {type:"video",src:"media/q10.mp4",answer:"REAL"}
  ];

  // Elements
  const media = document.getElementById("media");
  const round = document.getElementById("round");
  const timeText = document.getElementById("time");
  const bar = document.getElementById("bar");
  const result = document.getElementById("result");
  const realBtn = document.getElementById("realBtn");
  const aiBtn = document.getElementById("aiBtn");
  const nextBtn = document.getElementById("nextBtn");
  const startBtn = document.getElementById("startBtn");
  const saveBtn = document.getElementById("saveBtn");
  const leaderboard = document.getElementById("leaderboard");
  const refreshBtn = document.getElementById("refreshBtn");
  const resetBtn = document.getElementById("resetBtn");
  const teamInput = document.getElementById("teamInput");

  // State
  const DURATION = 60;
  let index = 0;
  let score = 0;
  let team = "";
  let time = DURATION;
  let timer = null;

  // Helpers
  function escapeHtml(s){
    return String(s ?? "")
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
  }

  function formatWhen(ts){
    try { return new Date(ts).toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"}); }
    catch { return ""; }
  }

  // Timer
  function startTimer(){
    clearInterval(timer);
    time = DURATION;
    timeText.textContent = time;
    bar.style.width = "100%";

    timer = setInterval(()=>{
      time--;
      timeText.textContent = time;
      bar.style.width = (time / DURATION * 100) + "%";
      if(time <= 0){
        clearInterval(timer);
        reveal(null);
      }
    }, 1000);
  }

  // Render question
  function render(){
    result.textContent = "";
    nextBtn.disabled = true;
    round.textContent = (index + 1) + " / " + QUESTIONS.length;

    media.innerHTML = "";
    const q = QUESTIONS[index];

    if(q.type === "image"){
      const img = document.createElement("img");
      img.src = q.src;
      img.alt = "Quiz image";
      media.appendChild(img);
    } else {
      const vid = document.createElement("video");
      vid.src = q.src;
      vid.controls = true;
      vid.playsInline = true;
      media.appendChild(vid);
    }

    startTimer();
  }

  // Reveal answer
  function reveal(choice){
    clearInterval(timer);
    const q = QUESTIONS[index];

    let points = 0;
    if(choice && choice === q.answer){
      points = time;
      score += points;
      result.textContent = "Correct! +" + points;
    } else {
      result.textContent = "Wrong!";
    }
    nextBtn.disabled = false;
  }

  // Buttons
  realBtn.onclick = () => reveal("REAL");
  aiBtn.onclick = () => reveal("AI");

  nextBtn.onclick = () => {
    if(index < QUESTIONS.length - 1){
      index++;
      render();
    } else {
      result.textContent = "Finished! Score: " + score + " — press Save Score ✅";
      saveBtn.disabled = false;
      nextBtn.disabled = true;
      clearInterval(timer);
    }
  };

  startBtn.onclick = () => {
    team = teamInput.value.trim();
    if(!team){ alert("Enter team name"); return; }

    index = 0;
    score = 0;
    saveBtn.disabled = true;

    realBtn.disabled = false;
    aiBtn.disabled = false;
    nextBtn.disabled = true;

    render();
  };

  // Save score
  saveBtn.onclick = async () => {
    try{
      await push(ref(db,"scores"),{
        name: team,
        score: Number(score),   // IMPORTANT: number for Top 10 query
        ts: Date.now()
      });
      alert("Saved ✅");
    } catch(e){
      alert("Save failed: " + (e?.code || e?.message || "unknown error"));
    }
  };

  // Leaderboard (Top 10 by score, realtime)
  const top10Query = query(ref(db, "scores"), orderByChild("score"), limitToLast(10));

  function renderLeaderboard(rows){
    if(!rows.length){
      leaderboard.innerHTML = "<tr><td colspan='4' class='muted'>No scores yet</td></tr>";
      return;
    }
    leaderboard.innerHTML = rows.map((r,i)=>`
      <tr>
        <td>${i+1}</td>
        <td>${escapeHtml(r.name)}</td>
        <td><b>${Number(r.score ?? 0)}</b></td>
        <td>${formatWhen(r.ts)}</td>
      </tr>
    `).join("");
  }

  onValue(top10Query, (snap) => {
    const rows = [];
    snap.forEach(childSnap => rows.push(childSnap.val()));
    rows.sort((a,b) => (b.score ?? 0) - (a.score ?? 0));
    renderLeaderboard(rows);
  }, (err) => {
    console.error(err);
    leaderboard.innerHTML = "<tr><td colspan='4' class='muted'>Leaderboard error</td></tr>";
  });

  // Manual refresh button (optional)
  refreshBtn.onclick = async () => {
    try{
      const snap = await get(top10Query);
      const rows = [];
      snap.forEach(childSnap => rows.push(childSnap.val()));
      rows.sort((a,b) => (b.score ?? 0) - (a.score ?? 0));
      renderLeaderboard(rows);
    }catch(e){
      alert("Refresh failed: " + (e?.code || e?.message || "unknown error"));
    }
  };

  // Teacher reset (PIN)
  resetBtn.onclick = async () => {
    const pin = prompt("Teacher PIN:");
    if(pin !== "1234"){ alert("Wrong PIN"); return; }
    if(!confirm("Reset the leaderboard for ALL tablets?")) return;

    try{
      await set(ref(db,"scores"), null);
      alert("Leaderboard reset ✅");
    }catch(e){
      alert("Reset failed: " + (e?.code || e?.message || "unknown error"));
    }
  };
</script>

</body>
</html>
